* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: var(--font-family-secondary);
    background-color: linear-gradient(135deg, var(--color-dark-primary) 0%, var(--color-dark-secondary) 100%);
    color: var(--website-navy);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

/* Section Container - Full Width with Background Map */
.destinations-section {
    position: relative;
    background-color: linear-gradient(135deg, #102632 0%, #25414E 100%);
    padding: 100px 0;
    width: 100%;
    overflow: hidden;
}

/* Full-width background map layer */
.map-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;    
    pointer-events: none;
    z-index: 0;
}

.map-background * {
    pointer-events: none;
}

.map-background #background-map {
    width: 100%;
    height: 100%;
    background-color: linear-gradient(135deg, var(--color-dark-primary) 0%, var(--color-dark-secondary) 100%);            
}

/* Allow marker interaction on background map */
.map-background .leaflet-marker-icon {
    pointer-events: auto !important;
    cursor: pointer !important;
}

.map-background .leaflet-marker-pane {
    pointer-events: auto !important;
    z-index: 600 !important;
}

.map-background .leaflet-pane {
    pointer-events: none !important;
}

.map-background .leaflet-overlay-pane {
    pointer-events: auto !important;
}

/* Content wrapper - sits on top of map background */
.section-content-wrapper {
    position: relative;
    z-index: 2000;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 60px;
    pointer-events: none; /* ADDED: Allow clicks to pass through to map */
}

.section-header {
    text-align: center;
    margin-bottom: 60px;
    position: relative;
    z-index: 2002;
    pointer-events: auto; /* ADDED: Keep header interactive */
}

.section-header h1 {
    font-family: var(--font-family-primary);
    font-size: 56px; /* Increased slightly for Garamond */
    font-weight: 600;
    color: #ec6d3a;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
}

.section-header p {
    font-family: var(--font-family-secondary);
    font-size: 20px; /* Increased slightly for Lora readability */
    color: #FFEADB;
    opacity: 0.8;
    max-width: 700px;
    margin: 0 auto;
    font-weight: 400;
}

/* Two-column layout - floats on top of background */
.map-container {
    display: flex;
    gap: 40px;
    align-items: stretch;
    min-height: 600px;
    position: relative;
    z-index: 2001; /* Ensure panel container is above map */
}

/* Left panel - Information with subtle transparency */
.info-panel {
    flex: 0 0 40%;
    background-color: #102632;  
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: all 0.4s ease;
    position: relative; /* For close btn positioning */
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    z-index: 2002; /* Explicitly higher than markers */
    pointer-events: auto; /* ADDED: Keep panel interactive */
}

.info-content {
    opacity: 1;
    transition: opacity 0.3s ease;
}

.info-content.fade-out {
    opacity: 0;
}

/* Close button - hidden by default (desktop) */
.close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(16, 38, 50, 0.6);
    border: none;
    color: #ec6d3a;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    display: none; /* Hidden on Desktop */
    z-index: 20;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    pointer-events: auto; /* ADDED */
}

.close-btn:hover {
    background: rgba(16, 38, 50, 0.9);
}

/* We explicitly hide it on desktop via media query just to be safe if display:none wasn't enough */
@media (min-width: 481px) {
    .close-btn {
        display: none !important;
    }
}


.destination-image {
    width: 100%;
    height: 320px;
    object-fit: cover;    
    margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(16, 38, 50, 0.12);
}

.destination-name {
    font-family: var(--font-family-primary);
    font-size: 42px; /* Increased for Garamond */
    font-weight: 600;
    color: #ec6d3a;
    margin-bottom: 16px;
    letter-spacing: 0;
}

.destination-description {
    font-family: var(--font-family-secondary);
    font-size: 17px;
    line-height: 1.8;
    color: #FFEADB;
    opacity: 0.9;
}

.default-content {
    text-align: center;
}

.default-content .destination-name {
    margin-bottom: 20px;
}

/* Right panel - Empty space (transparent, floats on background map) */
.map-panel {
    flex: 0 0 60%;
    position: relative;
    min-height: 600px;
    pointer-events: none;
    z-index: 1; /* Keep low so it doesn't block map if it overlaps */
}

/* Background map styling */
.leaflet-container {
    background-color: var(--website-white);
}

/* Ensure background map allows interaction */
#background-map .leaflet-marker-pane {
    pointer-events: auto !important;
}

#background-map .leaflet-overlay-pane {
    pointer-events: auto !important;
}

/* Custom marker styles */
.custom-marker {
    background-color: var(--website-orange);
    border: 3px solid var(--website-white);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    cursor: pointer !important;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(234, 93, 36, 0.4), 0 0 0 0 rgba(234, 93, 36, 0.4);
    pointer-events: auto !important;
    z-index: 1000 !important;
    position: relative;
}

.custom-marker:hover {
    background-color: var(--website-orange);
    transform: scale(1.3);
    box-shadow: 0 4px 16px rgba(234, 93, 36, 0.6), 0 0 0 8px rgba(234, 93, 36, 0.15);
}

/* Hide default popups - we use the left panel instead */
.leaflet-popup {
    display: none !important;
}

/* Remove any tile loading artifacts and ensure pure white background */
.leaflet-tile-pane {
    display: none !important;
}

/* Ensure background map base layers don't interfere */
#background-map .leaflet-tile-pane {
    pointer-events: none;
}

.leaflet-container {
    cursor: default !important;
}

/* Ensure markers are interactive on background map */
.custom-marker,
.leaflet-marker-icon {
    pointer-events: auto !important;
    cursor: pointer !important;
    z-index: 1000 !important;
}

.leaflet-marker-pane {
    pointer-events: auto !important;
}

/* Arctic Circle Label Style */
.arctic-circle-label {
    background: transparent;
    border: none;
    box-shadow: none;
    color: #ec6d3a;
    font-family: var(--font-family-secondary);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-shadow: 0px 0px 3px rgba(16, 38, 50, 0.5);
    white-space: nowrap;
}

/* Responsive adjustments */
@media (max-width: 1200px) {
    .section-content-wrapper {
        padding: 0 40px;
    }

    .destinations-section {
        padding: 80px 0;

    .section-header h1 {

}

@media (max-width: 968px) {

@media (max-width: 640px) {

    .section-header {

    }

    .section-header h1 {

    }

    .section-header p {
        font-size: 16px;

    .destination-image {

    .destination-name {

    .map-panel {
        min-height: 400px;

}

/* NEW: Specific rules for 480px and below */
@media (max-width: 480px) {
    /* Center the info panel as a popup overlay */
    .info-panel {
        display: none; /* Hide info panel by default */
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-width: 350px;
        max-height: 85vh;
        overflow-y: auto;
        background-color: #102632; /* Solid background color (Navy) */

        /* border-radius: 16px; */
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        margin: 0; /* Remove any flex margin */
        padding: 40px 24px 24px 24px; /* Top padding for close button */
    }

    .info-panel.visible {
        display: flex !important; /* Added !important to override display:none and force flex */
        flex-direction: column;
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .close-btn {
        display: flex !important; /* Force show on mobile */
    }

    .map-panel {
        min-height: 350px; /* Adjust map panel height */
        width: 100%;
    }

    .map-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    .map-background #background-map {
        left: -13px;
        top: -79px;      
    }

@keyframes popIn {
    0% { opacity: 0; transform: translate(-50%, -40%) scale(0.9); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* Loading state */
.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-size: var(--font-size-lg);
    color: var(--color-text-secondary);
}

   <script>
        /**
         * SVALBARD TRANSFORMATION CONFIG
         * * To fit Svalbard comfortably in the frame without reducing the scale of the entire map,
         * we perform a "cartographic shift". We identify Svalbard (lat > 72), scale it down,
         * and move it South-West closer to the mainland coast (creating an "inset" effect).
         */
        const SVALBARD_CONFIG = {
            thresholdLat: 72,      // Apply to anything above this latitude
            pivot: { lat: 78.0, lon: 16.0 }, // Approximate center of Svalbard for scaling
            scale: 0.40,           // Scale down to 55% size
            offset: { lat: -4.5, lon: -4.0 } // Move South 4.5deg, West 4.0deg
        };

        // Helper function to apply the transform to a single coordinate (Lat, Lon)
        function transformSvalbardCoordinate(lat, lon) {
            // Only transform high latitudes
            if (lat < SVALBARD_CONFIG.thresholdLat) return [lat, lon];
            
            // 1. Center relative to pivot
            const relLat = lat - SVALBARD_CONFIG.pivot.lat;
            const relLon = lon - SVALBARD_CONFIG.pivot.lon;
            
            // 2. Scale
            const scaledLat = relLat * SVALBARD_CONFIG.scale;
            const scaledLon = relLon * SVALBARD_CONFIG.scale;
            
            // 3. Translate back + Offset
            const newLat = SVALBARD_CONFIG.pivot.lat + scaledLat + SVALBARD_CONFIG.offset.lat;
            const newLon = SVALBARD_CONFIG.pivot.lon + scaledLon + SVALBARD_CONFIG.offset.lon;
            
            return [newLat, newLon];
        }

             {

        ];

        // AUTO-UPDATE SVALBARD DESTINATION
        // We must update the marker coordinates in the list to match our visual transformation
        destinations.forEach(dest => {
            if (dest.name === 'Svalbard') {
                const [newLat, newLon] = transformSvalbardCoordinate(dest.lat, dest.lon);
                dest.lat = newLat;
                dest.lon = newLon;
                // Also update mobile Lat if it exists, or just use main lat
                if(dest.mobileLat) {
                     const [mLat, mLon] = transformSvalbardCoordinate(dest.mobileLat, dest.mobileLon);
                     dest.mobileLat = mLat;
                     dest.mobileLon = mLon;
                }
            }
        });

        // Initialize the BACKGROUND map - simplified init
        const backgroundMap = L.map('background-map', {
            zoomControl: false,
            dragging: false,
            touchZoom: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false,
            tap: true,
            preferCanvas: true,
            attributionControl: false // ADDED: Hide Leaflet attribution
        });   

        // Add Arctic Circle Line (SHORTENED as requested)
        const arcticCircleLat = 66.5636;
        const arcticCircleLine = L.polyline([
            [arcticCircleLat, 2],  // Changed from -10 to 2
            [arcticCircleLat, 34]  // Changed from 45 to 34
        ], {
            color: '#ec6d3a', // Brand orange
            weight: 1.5,
            dashArray: '8, 8', // Dashed line
            opacity: 0.6,
            interactive: false
        }).addTo(backgroundMap);

        // Add Arctic Circle Label
        const labelIcon = L.divIcon({
            className: 'arctic-circle-label',
            html: 'Arctic Circle',
            iconSize: [100, 20],
            iconAnchor: [50, -5] // Position above line
        });
        L.marker([arcticCircleLat, 24], { icon: labelIcon, interactive: false }).addTo(backgroundMap);


        // Load high-resolution Country GeoJSON data from Natural Earth
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson')
            .then(response => response.json())
            .then(data => {
                
                // Function to process and add country polygons
                function addCountryToMap(countryName, isMainCountry) {
                    const countryFeature = data.features.find(feature => 
                        feature.properties.NAME === countryName || 
                        feature.properties.ADMIN === countryName
                    );

                    if (countryFeature) {
                        const geometry = countryFeature.geometry;
                        
                        if (geometry.type === 'MultiPolygon') {
                            // Find mainland center for filtering islands
                            let largestPolygon = null;
                            let maxArea = 0;
                            let mainlandBounds = null;
                            
                            geometry.coordinates.forEach(polygon => {
                                const area = polygon[0].length;
                                if (area > maxArea) {
                                    maxArea = area;
                                    largestPolygon = polygon;
                                    const lats = polygon[0].map(coord => coord[1]);
                                    const lons = polygon[0].map(coord => coord[0]);
                                    mainlandBounds = {
                                        centerLat: (Math.min(...lats) + Math.max(...lats)) / 2,
                                        centerLon: (Math.min(...lons) + Math.max(...lons)) / 2
                                    };
                                }
                            });
                            
                            // 1. FILTER Polygons (Keep mainland + Svalbard)
                            let filteredPolygons = geometry.coordinates.filter(polygon => {
                                // Always keep large chunks
                                if (polygon[0].length > 50) return true;

                                const lats = polygon[0].map(coord => coord[1]);
                                const lons = polygon[0].map(coord => coord[0]);
                                const centerLat = (Math.min(...lats) + Math.max(...lats)) / 2;
                                const centerLon = (Math.min(...lons) + Math.max(...lons)) / 2;
                                
                                // KEEP SVALBARD: Explicitly keep high latitude polygons (> 74N)
                                if (centerLat > 74) return true;

                                // Filter based on distance from mainland
                                const latDiff = Math.abs(centerLat - mainlandBounds.centerLat);
                                const lonDiff = Math.abs(centerLon - mainlandBounds.centerLon);
                                
                                return latDiff < 12 && lonDiff < 12; // Relaxed filter slightly
                            });

                            // 2. TRANSFORM Polygons (Scale/Shift Svalbard)
                            filteredPolygons = filteredPolygons.map(polygon => {
                                // Check if this is a high-latitude polygon (Svalbard)
                                const lats = polygon[0].map(c => c[1]);
                                const avgLat = lats.reduce((a,b) => a+b, 0) / lats.length;

                                if (avgLat > SVALBARD_CONFIG.thresholdLat) {
                                    // Transform the geometry
                                    // GeoJSON is [lon, lat], Leaflet is [lat, lon]. Be careful with indices.
                                    const transformedRing = polygon[0].map(coord => {
                                        const lon = coord[0];
                                        const lat = coord[1];
                                        const [newLat, newLon] = transformSvalbardCoordinate(lat, lon);
                                        return [newLon, newLat]; // Return as [lon, lat]
                                    });
                                    return [transformedRing];
                                }
                                return polygon;
                            });

                            
                            const filteredFeature = {
                                type: 'Feature',
                                properties: countryFeature.properties,
                                geometry: {
                                    type: 'MultiPolygon',
                                    coordinates: filteredPolygons
                                }
                            };
                            
                            L.geoJSON(filteredFeature, {
                                style: {
                                    color: '#ffffff',
                                    weight: 1.5,
                                    fillColor: 'rgba(255, 234, 219, 0.05)', 
                                    fillOpacity: 1,
                                    opacity: 0.8,
                                    lineJoin: 'round',
                                    lineCap: 'round'
                                }
                            }).addTo(backgroundMap);
                        }
                    }
                }

                // Add Norway, Sweden, and Finland
                addCountryToMap('Norway', true);
                addCountryToMap('Sweden', false);
                addCountryToMap('Finland', false);
            })
            .catch(error => console.error('Error loading borders:', error));


        // Custom marker icon
        const customIcon = L.divIcon({
            className: 'custom-marker',
            iconSize: [24, 24],
            iconAnchor: [12, 12],
            popupAnchor: [0, -12]
        });

        // Get info panel elements
        const infoContent = document.getElementById('info-content');
        const infoPanel = document.querySelector('.info-panel');
        const closeInfoPanelBtn = document.getElementById('close-info-panel'); // New Button
        let currentMarker = null;

        // Function to toggle z-index between map background and info panel
        function toggleZIndex(showPanel) {
        const mapBackground = document.querySelector('.map-background');
        const mapPanel = document.querySelector('.map-panel');
    
            if (showPanel) {
            // Mobile only z-index logic
            mapBackground.style.zIndex = '1';
            mapPanel.style.zIndex = '1000';
            console.log('Z-index switched: Panel on top');
            } 
            
            else {
            mapBackground.style.zIndex = '1'; // Keep it low
            mapPanel.style.zIndex = '1';
            console.log('Z-index switched: Map on top');
            }
        }

        // Function to update info panel
        function updateInfoPanel(destination) {
            // Fade out
            infoContent.classList.add('fade-out');

            setTimeout(() => {
                // Update content
                if (destination) {
                    infoContent.innerHTML = `
                        <img src="${destination.image}" alt="${destination.name}" class="destination-image">
                        <h2 class="destination-name">${destination.name}</h2>
                        <p class="destination-description">${destination.description}</p>
                    `;
                } else {
                    // Reset to default
                    infoContent.innerHTML = `
                        <div class="default-content">
                            <h2 class="destination-name">Nordic Adventures</h2>
                            <p class="destination-description">Explore stunning destinations across Norway, Sweden, and Finland. Hover over the markers on the map to discover each unique location.</p>
                        </div>
                    `;
                }

                // Fade in
                infoContent.classList.remove('fade-out');
            }, 300);
        }

        // Add markers for each destination to the BACKGROUND map
       function getResponsiveCoords(destination) {
            if (window.innerWidth <= 480 && destination.mobileLat !== undefined && destination.mobileLon !== undefined) {
                return [destination.mobileLat, destination.mobileLon];
            }
            return [destination.lat, destination.lon];
}

    destinations.forEach(destination => {
        const [lat, lon] = getResponsiveCoords(destination);

        const marker = L.marker([lat, lon], {
            icon: customIcon,
            interactive: true,
            bubblingMouseEvents: false // Prevent map click closing
        }).addTo(backgroundMap);

        // Store destination data with marker
        marker.destinationData = destination;

        // Get the marker element and ensure it's interactive
        const markerElement = marker.getElement();
        if (markerElement) {
            markerElement.style.pointerEvents = 'auto';
            markerElement.style.cursor = 'pointer';
            markerElement.style.zIndex = '1000';
        }

        // Update info panel on hover
        marker.on('mouseover', function(e) {
            if (window.innerWidth <= 480) return; // Only hover on desktop

            console.log('Marker hover:', destination.name);
            currentMarker = this;
            updateInfoPanel(destination);
            e.originalEvent.stopPropagation();
        });

        // Also update on click (for mobile)
        marker.on('click', function(e) {
            console.log('Marker click:', destination.name);
            currentMarker = this;
            updateInfoPanel(destination);

            if (window.innerWidth <= 480) {
                infoPanel.classList.add('visible');
                toggleZIndex(true);
            }

            e.originalEvent.stopPropagation();
        });

        // Add mouseenter event as backup
        marker.on('mouseenter', function() {
            if (window.innerWidth <= 480) return; // Only on desktop

            console.log('Marker mouseenter:', destination.name);
            currentMarker = this;
            updateInfoPanel(destination);
        });

        // Keep info displayed on mouseout - removed auto-reset for better UX
    });


        // ADDED: Close button logic
        if (closeInfoPanelBtn) {
            closeInfoPanelBtn.addEventListener('click', function(e) {
                e.stopPropagation(); // Prevent click from bubbling to map
                infoPanel.classList.remove('visible');
                toggleZIndex(false);
            });
        }

        // ADDED: Click on map to hide info panel on mobile
        backgroundMap.on('click', function() {
            if (window.innerWidth <= 480) {
                infoPanel.classList.remove('visible');
                toggleZIndex(false);
            }
        });


        // ADDED: Smart "Fit Bounds" Function to replace fixed zooms
        // This ensures Svalbard (Top) and Oslo (Bottom) are always visible
        function fitMapToMarkers() {
            if (!destinations || destinations.length === 0) return;

            const mapContainer = document.getElementById('background-map');
            // Safety check: if map has no dimensions, fitting bounds will fail with NaN
            if (!mapContainer || mapContainer.clientWidth === 0 || mapContainer.clientHeight === 0) return;

            // Invalidate size FIRST to ensure Leaflet reads correct dimensions
            backgroundMap.invalidateSize();

            // Create bounds from all destinations
            const bounds = L.latLngBounds(destinations.map(d => [d.lat, d.lon]));

            // On desktop, the info panel covers the left 40% of the screen.
            // We need to 'pad' the map so it fits markers into the visible 60% on the right.
            
            if (window.innerWidth > 968) {
                // CHANGED: Use exact panel position for padding
                // This prevents the map from over-shifting on wide screens
                const infoPanel = document.querySelector('.info-panel');
                let leftPadding = 500; // Default fallback
                
                if (infoPanel) {
                    const rect = infoPanel.getBoundingClientRect();
                    // Left padding should be where the panel ends + a small buffer (50px)
                    leftPadding = rect.right + 50;
                }

                backgroundMap.fitBounds(bounds, {
                    paddingTopLeft: [leftPadding, 80], // [x, y] - Push from left, and top
                    paddingBottomRight: [50, 100],      // [x, y] - INCREASED bottom padding to 100px
                    animate: false 
                });
            } else {
                // Mobile/Tablet: Standard padding
                backgroundMap.fitBounds(bounds, {
                    padding: [50, 50],
                    animate: false
                });
            }
        }

        // Adjust map on window resize
        window.addEventListener('resize', () => {
            fitMapToMarkers();
        });

        // Call on initial load
        // Tiny timeout ensures container has sizing before fitting
        setTimeout(fitMapToMarkers, 100);

    </script>
