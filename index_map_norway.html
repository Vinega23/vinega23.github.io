<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nordic Destinations - Interactive Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-dark-primary: #102632;
            --color-dark-secondary: #25414E;
            --color-grey-medium: #f8f8f8;
            --color-light-bg: #FFEADB;
            --color-accent: #ec6d3a;
            --color-white: #FFFFFF;
            --color-black-transparent: rgba(21, 20, 25, 0.95);
            --color-black-scrolled: rgba(21, 20, 25, 1);
            --font-primary: "EB Garamond", "Garamond", "Georgia", serif;
            --font-secondary: "Lora", "Times New Roman", serif;
            
            /* Spacing Tokens */
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
            
            /* Z-Index Layers */
            --z-map: 1;
            --z-ui: 10;
            --z-popup: 100;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: var(--font-secondary);
            color: var(--color-dark-primary);
            overflow: hidden; /* Prevent body scroll, map handles interaction */
        }

        /* --- Main Container --- */
        .destinations-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-color: var(--color-light-bg);
        }

        /* --- Map Layer --- */
        #background-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: var(--z-map);
            outline: none;
            background-color: #f5f5f5; /* Light background to match new tiles */
        }

        /* --- Content/Sidebar Layer --- */
        .content-wrapper {
            position: relative;
            z-index: var(--z-ui);
            pointer-events: none; /* Let clicks pass through to map in empty areas */
            width: 100%;
            height: 100%;
            display: flex;
        }

        .info-panel {
            pointer-events: auto; /* Re-enable clicks for the panel */
            background-color: var(--color-white);
            color: var(--color-dark-primary);
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 25px rgba(0,0,0,0.08); 
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* --- Content Typography --- */
        .panel-header {
            padding: var(--spacing-lg) var(--spacing-lg) 0;
        }

        .destination-label {
            font-family: var(--font-primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-accent); 
            margin-bottom: var(--spacing-xs);
            display: block;
        }

        .destination-title {
            font-family: var(--font-primary);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: var(--spacing-sm);
            color: var(--color-dark-primary);
        }

        .panel-scroll {
            padding: var(--spacing-sm) var(--spacing-lg) var(--spacing-lg);
            overflow-y: auto;
            flex-grow: 1;
            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: var(--color-dark-secondary) transparent;
        }

        /* --- Image Styles --- */
        .destination-image-container {
            width: 100%;
            height: 200px; /* Fixed height for consistency */
            margin-bottom: var(--spacing-md);
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--color-grey-medium);
            position: relative;
        }

        .destination-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .destination-image-container:hover .destination-image {
            transform: scale(1.05);
        }

        .destination-description p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: var(--spacing-sm);
            color: var(--color-dark-secondary); 
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
            border-top: 1px solid var(--color-grey-medium);
            padding-top: var(--spacing-md);
        }

        .meta-item strong {
            display: block;
            font-family: var(--font-primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-dark-secondary);
            margin-bottom: 4px;
        }

        /* --- Close Button (Mobile/Tablet) --- */
        .close-btn {
            display: none; /* Hidden on Desktop */
            position: absolute;
            top: var(--spacing-sm);
            right: var(--spacing-sm);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 1001;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.9);
            color: var(--color-dark-primary);
            transition: background 0.2s;
        }
        .close-btn:hover {
            background-color: var(--color-grey-medium);
        }
        
        /* --- Map Interaction Hint (Light Version) --- */
        .map-hint {
            position: absolute;
            top: var(--spacing-md);
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            z-index: var(--z-ui);
            background-color: rgba(255, 255, 255, 0.95); /* White bg */
            padding: 8px 20px;
            border-radius: 30px;
            font-family: var(--font-primary);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--color-dark-primary); /* Dark text */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: none; 
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        .map-hint.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* =========================================
           RESPONSIVE BREAKPOINTS
           ========================================= */

        /* --- Desktop (Large > 1024px) --- */
        @media (min-width: 1025px) {
            .info-panel {
                width: 400px;
                height: 100%;
                border-right: 1px solid rgba(0,0,0,0.05);
            }
        }

        /* --- Tablet / Small Laptop (641px - 1024px) --- */
        @media (max-width: 1024px) and (min-width: 641px) {
            .info-panel {
                position: absolute;
                bottom: 20px;
                left: 20px;
                width: 350px;
                max-height: 80vh;
                height: auto;
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                opacity: 0; 
                transform: translateY(20px);
                pointer-events: none; 
                visibility: hidden;
            }

            .info-panel.active {
                opacity: 1;
                transform: translateY(0);
                pointer-events: auto;
                visibility: visible;
            }
            
            .close-btn {
                display: block;
            }
        }

        /* --- Mobile (< 640px) --- */
        @media (max-width: 640px) {
            .info-panel {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: auto;
                max-height: 100vh; 
                border-radius: 20px 20px 0 0;
                box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
                transform: translateY(100%); 
                transition: transform 0.3s ease-out;
                z-index: var(--z-popup);
                padding-bottom: env(safe-area-inset-bottom); 
            }

            .info-panel.active {
                transform: translateY(0);
            }

            .panel-header {
                padding: var(--spacing-md);
            }
            
            .panel-scroll {
                padding: 0 var(--spacing-md) var(--spacing-lg);
            }
            
            .destination-title {
                font-size: 1.75rem;
            }

            .close-btn {
                display: block;
                top: 10px;
                right: 10px;
            }
            
            .meta-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-sm);
            }
        }

        /* --- Marker Styles (Light Version) --- */
        .custom-div-icon {
            background: transparent;
            border: none;
        }

        .marker-pin {
            width: 30px;
            height: 30px;
            border-radius: 50% 50% 50% 0;
            /* CHANGED: Navy body to contrast with light map */
            background: var(--color-dark-primary); 
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -15px 0 0 -15px;
            animation-name: bounce-2;
            animation-fill-mode: both;
            animation-duration: 1s;
            cursor: pointer;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .marker-pin::after {
            content: '';
            width: 14px;
            height: 14px;
            margin: 8px 0 0 8px;
            /* CHANGED: White/Cream dot */
            background: var(--color-white); 
            position: absolute;
            border-radius: 50%;
        }

        .marker-pin:hover {
            transform: rotate(-45deg) scale(1.1);
            background: var(--color-accent); /* Orange on hover */
        }
        .marker-pin:hover::after {
            background: var(--color-white); 
        }

        .marker-pin.active {
            background: var(--color-accent); /* Orange when active */
            transform: rotate(-45deg) scale(1.2);
            z-index: 1000;
        }
        .marker-pin.active::after {
             background: var(--color-white);
        }

        /* --- Arctic Label Style (Light Version) --- */
        .arctic-label {
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .arctic-label span {
            background-color: rgba(255, 255, 255, 0.7);      
            padding: 4px 12px;
            border-radius: 20px;
            font-family: var(--font-primary);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--color-dark-primary); /* Dark Navy text */
            font-weight: 500;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(16, 38, 50, 0.1); /* Subtle border */
        }

    </style>
</head>
<body>

        <!-- Content Overlay -->

            <aside class="info-panel" id="infoPanel">

                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>

                <div class="panel-header">
                    <span class="destination-label">Featured Destination</span>
                    <h2 class="destination-title" id="destTitle">Select a Marker</h2>
                </div>

                <div class="panel-scroll">
                    <!-- Image Element -->
                    <div class="destination-image-container" id="destImageContainer" style="display: none;">
                        <img id="destImage" class="destination-image" src="" alt="Destination View" />
                    </div>

                    <div class="destination-description" id="destDesc">

                    </div>

                        <div class="meta-item">
                            <strong>Activity</strong>
                            <span id="metaActivity">--</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

        // --- State Management ---
        let mapInstance = null;
        let markers = [];
        let currentActiveId = null;

        // --- Initialization ---
        function initMap() {
            // 1. Setup Map
            // Using a clean, minimal tile layer suitable for background
            mapInstance = L.map('background-map', {
                zoomControl: false, 
                attributionControl: false,
                scrollWheelZoom: false, 
                doubleClickZoom: false,
                dragging: false, // Locked
                touchZoom: false, // Locked
                boxZoom: false, // Locked
                keyboard: false, // Locked
                zoomSnap: 0.1 // Smooth zooming
            });

            // CHANGED: Positron (Light) Tiles for Clean/Minimalist Look
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/light_nolabels/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CartoDB',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(mapInstance);

            // 2. Add Markers
            addMarkers();

            // 3. Add Arctic Circle Line and Label
            addArcticCircle();

            // 4. Initial Fit
            fitMapToMarkers();

            // 5. Events
            window.addEventListener('resize', debounce(fitMapToMarkers, 150));
            
            // Allow map clicks to close panel on mobile/tablet
            mapInstance.on('click', () => {
                closePanel();
            });
        }

        function addArcticCircle() {
            const arcticCircleLat = 66.563; // Approximate Latitude
            
            // Draw Dashed Line
            const arcticLine = L.polyline([
                [arcticCircleLat, 0],  // Start West
                [arcticCircleLat, 35]  // End East (Covering Norway, Sweden, Finland)
            ], {
                // color: '#102632', // CHANGED: Navy for high contrast on light map
                color: '#ec6d3a', // CHANGED: Navy for high contrast on light map
                weight: 2,
                dashArray: '4, 8', // Finer dash
                opacity: 1, // Visible but not overpowering
                interactive: false
            }).addTo(mapInstance);

            // Add Label
            // Placed centrally around Sweden/Finland border longitude
            L.marker([arcticCircleLat, 18], { 
                icon: L.divIcon({
                    className: 'arctic-label',
                    html: '<span>Arctic Circle</span>',
                    iconSize: [120, 24],
                    iconAnchor: [60, 12] // Center the label on the line
                }),
                interactive: false,
                zIndexOffset: -100 // Keep it behind main markers
            }).addTo(mapInstance);
        }

        function addMarkers() {
            destinations.forEach(dest => {
                const lat = dest.displayLat || dest.lat;
                const lng = dest.displayLng || dest.lng;

                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="marker-pin" id="marker-${dest.id}"></div>`,
                    iconSize: [30, 42],
                    iconAnchor: [15, 42]
                });

                const marker = L.marker([lat, lng], { icon: icon }).addTo(mapInstance);
                
                // Click Handler
                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e); // Prevent map click
                    activateDestination(dest);
                });

                markers.push({ id: dest.id, marker: marker, data: dest });
            });
        }

        function activateDestination(dest) {
            currentActiveId = dest.id;

            // Update UI
            document.getElementById('destTitle').textContent = dest.name;
            document.getElementById('destDesc').innerHTML = `<p>${dest.description}</p>`;
            document.getElementById('metaTime').textContent = dest.bestTime;
            document.getElementById('metaActivity').textContent = dest.activity;
            document.getElementById('destMeta').style.display = 'grid';

            // ADDED: Update Image
            const imgContainer = document.getElementById('destImageContainer');
            const imgElement = document.getElementById('destImage');
            
            if (dest.image) {
                imgElement.src = dest.image;
                imgElement.alt = `View of ${dest.name}`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.style.display = 'none';
            }

            // Visual State for Markers
            document.querySelectorAll('.marker-pin').forEach(el => el.classList.remove('active'));
            document.getElementById(`marker-${dest.id}`).classList.add('active');

            // Show Panel
            const panel = document.getElementById('infoPanel');
            panel.classList.add('active');
            
            // Show Hint
            document.getElementById('mapHint').classList.add('visible');

            // Responsive Panning
            panToMarker(dest);
        }

        function closePanel() {
            const panel = document.getElementById('infoPanel');
            panel.classList.remove('active');
            
            // Hide Hint
            document.getElementById('mapHint').classList.remove('visible');
            
            // Reset text after animation to avoid jumpiness, optionally
            setTimeout(() => {
                if(!panel.classList.contains('active')) {
                   document.querySelectorAll('.marker-pin').forEach(el => el.classList.remove('active'));
                   fitMapToMarkers(); // Re-center map broadly
                   currentActiveId = null; // Clear state
                }
            }, 300);
        }

        function panToMarker(dest) {
            const lat = dest.displayLat || dest.lat;
            const lng = dest.displayLng || dest.lng;
            const width = window.innerWidth;
            const height = window.innerHeight;

            let targetLat = lat;
            let targetLng = lng;

            if (width <= 640) {
                // Mobile
                const zoom = mapInstance.getZoom();
                const point = mapInstance.project([lat, lng], zoom);
                const targetPoint = point.add([0, height * 0.15]); 
                const newCenter = mapInstance.unproject(targetPoint, zoom);
                mapInstance.panTo(newCenter, { animate: true, duration: 0.5 });

            } else if (width <= 1024) {
                // Tablet
                const zoom = mapInstance.getZoom();
                const point = mapInstance.project([lat, lng], zoom);
                const targetPoint = point.add([0, height * 0.1]); 
                const newCenter = mapInstance.unproject(targetPoint, zoom);
                mapInstance.panTo(newCenter, { animate: true });
            } else {
                // Desktop
                mapInstance.flyTo([lat, lng], 6, { animate: true });
            }
        }

        /* --- CORE RESPONSIVE LOGIC --- */
        function fitMapToMarkers() {
            if (!mapInstance || markers.length === 0) return;

            const group = L.featureGroup(markers.map(m => m.marker));
            const bounds = group.getBounds();
            const width = window.innerWidth;

            let paddingOptions = {};

            if (width > 1024) {
                // DESKTOP: Sidebar Left
                paddingOptions = {
                    paddingTopLeft: [450, 50], 
                    paddingBottomRight: [50, 50]
                };

            } else if (width > 640) {
                // TABLET
                paddingOptions = {
                    paddingTopLeft: [50, 50],
                    paddingBottomRight: [50, 100]
                };

            } else {
                // MOBILE
                paddingOptions = {
                    padding: [30, 30] 
                };
            }

            mapInstance.fitBounds(bounds, {
                ...paddingOptions,
                animate: true,
                duration: 1.0
            });
        }

        // Utility: Debounce resize events
        function debounce(func, wait) {
            let timeout;
            return function() {
                const context = this, args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), wait);
            };
        }

        // Start
        document.addEventListener('DOMContentLoaded', initMap);

    </script>
</body>
</html>
